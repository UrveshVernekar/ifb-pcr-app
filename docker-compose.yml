services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000/api/v1}
    image: ifb-pcr-app:latest
    container_name: ifb-pcr-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
